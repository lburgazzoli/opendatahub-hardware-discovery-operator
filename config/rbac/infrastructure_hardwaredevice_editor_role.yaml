# This rule is not used by the project opendatahub-hardware-discovery-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the infrastructure.platform.opendatahub.io.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: opendatahub-hardware-discovery-operator
    app.kubernetes.io/managed-by: kustomize
  name: infrastructure-hardwaredevice-editor-role
rules:
- apiGroups:
  - infrastructure.platform.opendatahub.io
  resources:
  - hardwaredevices
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - infrastructure.platform.opendatahub.io
  resources:
  - hardwaredevices/status
  verbs:
  - get
