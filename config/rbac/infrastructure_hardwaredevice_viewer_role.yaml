# This rule is not used by the project opendatahub-hardware-discovery-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to infrastructure.platform.opendatahub.io resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: opendatahub-hardware-discovery-operator
    app.kubernetes.io/managed-by: kustomize
  name: infrastructure-hardwaredevice-viewer-role
rules:
- apiGroups:
  - infrastructure.platform.opendatahub.io
  resources:
  - hardwaredevices
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - infrastructure.platform.opendatahub.io
  resources:
  - hardwaredevices/status
  verbs:
  - get
