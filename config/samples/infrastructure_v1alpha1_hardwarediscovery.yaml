# Example HardwareDiscovery singleton.
#
# The instance name must be exactly "cluster"; the root-schema CEL rule
# rejects any other name. Both sources are enabled by default; a nil or
# omitted arm means enabled (evidence-gated), so this minimal example is
# the complete configuration — no source block is required at all.
#
# This example matches the demonstration's node pool. The DRA source reads
# native resource.k8s.io/v1 ResourceSlices of the allow-listed drivers; the
# classic source reads node extended resources plus GFD-style labels.
apiVersion: infrastructure.platform.opendatahub.io/v1alpha1
kind: HardwareDiscovery
metadata:
  name: cluster
spec:
  class: accelerator
  nodeSelector:
    matchLabels:
      run.ai/simulated-gpu-node-pool: default
  maxStale: 10m
  rescanPeriod: 5m
  nodeGracePeriod: 15m
  sources:
    dra:
      enabled: true
      driverAllowList:
      - gpu.nvidia.com
    classic:
      enabled: true
      resourceName: nvidia.com/gpu
