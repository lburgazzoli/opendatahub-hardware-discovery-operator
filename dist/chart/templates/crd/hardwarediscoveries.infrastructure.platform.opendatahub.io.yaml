{{- if .Values.crd.enabled }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    {{- if .Values.crd.keep }}
    "helm.sh/resource-policy": keep
    {{- end }}
    controller-gen.kubebuilder.io/version: v0.22.0
  name: hardwarediscoveries.infrastructure.platform.opendatahub.io
spec:
  group: infrastructure.platform.opendatahub.io
  names:
    kind: HardwareDiscovery
    listKind: HardwareDiscoveryList
    plural: hardwarediscoveries
    singular: hardwarediscovery
  scope: Cluster
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          HardwareDiscovery is the singleton configuration of the hardware discovery
          service. Exactly one object named "cluster" may exist; the fixed instance
          name is enforced by a root-schema CEL rule, so no webhook is needed.
          Deleting and recreating "cluster" is the documented reset path.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec is the desired state of HardwareDiscovery.
            properties:
              class:
                description: |-
                  class is the device class this singleton discovers. accelerator is
                  the only class in this PoC; new values are additive, reviewed schema
                  changes.
                enum:
                - accelerator
                type: string
                x-kubernetes-validations:
                - message: class is immutable
                  rule: self == oldSelf
              maxStale:
                default: 10m
                description: |-
                  maxStale bounds the heartbeat for unchanged facts: unchanged
                  successful observations rewrite status at most this often.
                pattern: ^([0-9]+(s|m|h))+$
                type: string
              nodeGracePeriod:
                default: 15m
                description: |-
                  nodeGracePeriod is how long devices of an absent or UID-changed node
                  are retained before pruning. The deadline is persisted on each
                  HardwareDevice via the node-orphaned-at annotation so controller
                  restarts cannot reset it.
                pattern: ^([0-9]+(s|m|h))+$
                type: string
              nodeSelector:
                description: |-
                  nodeSelector selects the nodes whose devices are discovered. An
                  omitted or empty selector matches all eligible nodes.
                properties:
                  matchExpressions:
                    description: matchExpressions is a list of label selector requirements.
                      The requirements are ANDed.
                    items:
                      description: |-
                        A label selector requirement is a selector that contains values, a key, and an operator that
                        relates the key and values.
                      properties:
                        key:
                          description: key is the label key that the selector applies
                            to.
                          type: string
                        operator:
                          description: |-
                            operator represents a key's relationship to a set of values.
                            Valid operators are In, NotIn, Exists and DoesNotExist.
                          type: string
                        values:
                          description: |-
                            values is an array of string values. If the operator is In or NotIn,
                            the values array must be non-empty. If the operator is Exists or DoesNotExist,
                            the values array must be empty. This array is replaced during a strategic
                            merge patch.
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: atomic
                      required:
                      - key
                      - operator
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  matchLabels:
                    additionalProperties:
                      type: string
                    description: |-
                      matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                      map is equivalent to an element of matchExpressions, whose key field is "key", the
                      operator is "In", and the values array contains only "value". The requirements are ANDed.
                    type: object
                type: object
                x-kubernetes-map-type: atomic
              rescanPeriod:
                default: 5m
                description: |-
                  rescanPeriod bounds the periodic rescan that runs even without input
                  events.
                pattern: ^([0-9]+(s|m|h))+$
                type: string
              sources:
                description: sources holds the source-specific settings.
                properties:
                  classic:
                    description: |-
                      classic configures the classic labels source (GFD-style node labels
                      plus node extended resources).
                    properties:
                      enabled:
                        default: true
                        description: enabled turns the classic labels source on or
                          off.
                        type: boolean
                      resourceName:
                        default: nvidia.com/gpu
                        description: |-
                          resourceName is the extended resource whose presence in node
                          allocatable or capacity is classic-plane evidence.
                        pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*\/)?[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                        type: string
                    type: object
                  dra:
                    description: dra configures the stable resource.k8s.io/v1 source.
                    properties:
                      driverAllowList:
                        default:
                        - gpu.nvidia.com
                        description: |-
                          driverAllowList restricts which DRA drivers are trusted to advertise
                          whole GPUs. Only allow-listed drivers are read.
                        items:
                          type: string
                        type: array
                      enabled:
                        default: true
                        description: enabled turns the stable DRA source on or off.
                        type: boolean
                    type: object
                type: object
            required:
            - class
            type: object
          status:
            description: status is the observed state of HardwareDiscovery.
            properties:
              conditions:
                items:
                  properties:
                    lastHeartbeatTime:
                      description: |-
                        The last time we got an update on a given condition, this should not be set and is
                        present only for backward compatibility reasons
                      format: date-time
                      type: string
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.
                        If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: message is a human-readable message indicating
                        details about the transition.
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration
                        is 9, the condition is out of date with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        The value should be a CamelCase string.
                      type: string
                    severity:
                      description: |-
                        Severity with which to treat failures of this type of condition.
                        When this is not specified, it defaults to Error.
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-type: atomic
              nodeSummaries:
                description: nodeSummaries is a compact per-selected-node inventory
                  overview.
                items:
                  description: NodeSummary is the per-node inventory overview of one
                    selected node.
                  properties:
                    deviceCount:
                      description: |-
                        deviceCount is the number of the service's owned HardwareDevice
                        objects for this node.
                      format: int32
                      minimum: 0
                      type: integer
                    name:
                      description: name is the Node name.
                      maxLength: 253
                      minLength: 1
                      type: string
                    outcome:
                      description: |-
                        outcome is whether the last enumeration of this node was an
                        authoritative snapshot (Success, possibly empty) or unknown
                        (Unknown: error, missing API, forbidden, or incomplete pool).
                      enum:
                      - Success
                      - Unknown
                      type: string
                    plane:
                      description: |-
                        plane is the allocation plane that claimed the node, omitted when
                        unknown.
                      enum:
                      - classic
                      - dra
                      type: string
                    uid:
                      description: uid is the last observed Node UID.
                      maxLength: 64
                      minLength: 1
                      type: string
                  required:
                  - deviceCount
                  - name
                  - outcome
                  - uid
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              observedGeneration:
                description: The generation observed by the resource controller.
                format: int64
                type: integer
              phase:
                type: string
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: the HardwareDiscovery singleton must be named 'cluster'
          rule: self.metadata.name == 'cluster'
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
